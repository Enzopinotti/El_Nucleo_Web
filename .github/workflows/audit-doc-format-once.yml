name: Audit doc formatter once

on:
  push:
    branches:
      - chore/2026-repository-hardening-audit
    paths:
      - .github/workflows/audit-doc-format-once.yml

permissions:
  contents: write

jobs:
  format-audit-doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    steps:
      - name: Check out hardening branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/2026-repository-hardening-audit

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: modern/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Install frozen dependencies
        working-directory: modern
        run: pnpm install --frozen-lockfile

      - name: Format audit document
        working-directory: modern
        run: pnpm exec prettier --write ../docs/repository-audit-2026.md

      - name: Commit only canonical audit formatting
        run: |
          git diff --check
          unexpected="$(git diff --name-only | grep -v '^docs/repository-audit-2026.md$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --quiet -- docs/repository-audit-2026.md; then
            echo "No formatting change required."
            exit 0
          fi
          git config user.name "Enzo Pinotti"
          git config user.email "enzopinottii@gmail.com"
          git add docs/repository-audit-2026.md
          git commit -m "style(docs): format repository audit"
          git push origin HEAD:chore/2026-repository-hardening-audit
