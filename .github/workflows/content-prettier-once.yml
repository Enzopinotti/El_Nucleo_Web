name: Content Prettier one-shot

on:
  push:
    branches:
      - modernize/2026-content-platform

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modern
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write src/content/landing-content.ts src/content/local-content.ts
          git diff --check
          git diff -- src/content/landing-content.ts src/content/local-content.ts
