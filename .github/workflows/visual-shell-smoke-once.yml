name: Visual shell browser smoke once

on:
  push:
    branches:
      - modernize/2026-visual-shell
    paths:
      - .github/workflows/visual-shell-smoke-once.yml

permissions:
  contents: read

concurrency:
  group: visual-shell-browser-smoke-once
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out visual shell branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-visual-shell

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install and build
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Serve production build
        run: |
          mkdir -p visual-qa
          cd modern
          pnpm preview --host 127.0.0.1 --port 4173 > ../visual-qa/preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../visual-qa/preview.log
          exit 1

      - name: Validate shell in production Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || { echo "Chrome/Chromium unavailable"; exit 1; }
          "$CHROME_BIN" --version | tee visual-qa/browser-version.txt
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/el-nucleo-visual-shell \
            http://127.0.0.1:4173/ > visual-qa/chrome.log 2>&1 &

          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9222/json/list > /dev/null && break
            sleep 1
          done

          cat > visual-qa/capture.mjs <<'NODE'
          import fs from "node:fs/promises";

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const targets = await fetch("http://127.0.0.1:9222/json/list").then((r) => r.json());
          const target = targets.find((candidate) => candidate.type === "page");
          if (!target?.webSocketDebuggerUrl) throw new Error("Chrome page target unavailable");

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(event.data);
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            message.error ? waiter.reject(new Error(message.error.message)) : waiter.resolve(message.result ?? {});
          });
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const next = ++id;
            pending.set(next, { resolve, reject });
            socket.send(JSON.stringify({ id: next, method, params }));
          });
          const evaluate = async (expression) => {
            const result = await send("Runtime.evaluate", { expression, awaitPromise: true, returnByValue: true });
            return result.result?.value;
          };
          const setViewport = async (width, height) => {
            await send("Emulation.setDeviceMetricsOverride", {
              width,
              height,
              deviceScaleFactor: 1,
              mobile: false,
              screenWidth: width,
              screenHeight: height,
            });
            await evaluate("window.scrollTo(0, 0)");
            await sleep(220);
          };
          const warmLazyImages = async () => {
            await evaluate(`(async () => {
              const images = [...document.images];
              for (const image of images) {
                image.scrollIntoView({ block: "center", inline: "nearest", behavior: "instant" });
                await new Promise((resolve) => setTimeout(resolve, 90));
              }
              await Promise.all(images.map((image) => {
                if (image.complete) return Promise.resolve();
                return new Promise((resolve) => {
                  const done = () => resolve();
                  image.addEventListener("load", done, { once: true });
                  image.addEventListener("error", done, { once: true });
                  setTimeout(resolve, 1800);
                });
              }));
              window.scrollTo(0, 0);
              await new Promise((resolve) => setTimeout(resolve, 220));
            })()`);
          };
          const screenshot = async (name) => {
            const metrics = await send("Page.getLayoutMetrics");
            const content = metrics.cssContentSize ?? metrics.contentSize;
            const shot = await send("Page.captureScreenshot", {
              format: "png",
              fromSurface: true,
              captureBeyondViewport: true,
              clip: { x: 0, y: 0, width: content.width, height: content.height, scale: 1 },
            });
            await fs.writeFile(`visual-qa/${name}.png`, Buffer.from(shot.data, "base64"));
            return { width: content.width, height: content.height };
          };

          await send("Page.enable");
          await send("Runtime.enable");
          await sleep(500);

          const evidence = { title: await evaluate("document.title"), viewports: {} };
          for (const viewport of [
            { name: "mobile-360", width: 360, height: 900 },
            { name: "tablet-768", width: 768, height: 1024 },
            { name: "desktop-1440", width: 1440, height: 1000 },
          ]) {
            await setViewport(viewport.width, viewport.height);
            await warmLazyImages();
            evidence.viewports[viewport.name] = {
              page: await screenshot(`visual-shell-${viewport.name}`),
              documentOverflow: await evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth"),
              nav: await evaluate(`(() => {
                const nav = document.querySelector(".site-nav");
                const style = getComputedStyle(nav);
                const rect = nav.getBoundingClientRect();
                return {
                  display: style.display,
                  width: rect.width,
                  scrollWidth: nav.scrollWidth,
                  clientWidth: nav.clientWidth,
                  linkCount: nav.querySelectorAll("a").length,
                  fullyInsideViewport: rect.left >= -0.5 && rect.right <= innerWidth + 0.5
                };
              })()`),
              headerPosition: await evaluate('getComputedStyle(document.querySelector(".site-header")).position'),
            };
          }

          await setViewport(1440, 1000);
          await warmLazyImages();
          evidence.h1Count = await evaluate('document.querySelectorAll("h1").length');
          evidence.images = await evaluate(`[...document.images].map((img) => ({ alt: img.alt, complete: img.complete, naturalWidth: img.naturalWidth, src: img.getAttribute("src") }))`);
          evidence.shell = await evaluate(`(() => {
            const header = document.querySelector(".site-header");
            const hero = document.querySelector(".hero");
            const context = document.querySelector(".hero__context");
            const mark = document.querySelector(".hero__mark-frame");
            const sticky = [
              ".about-section__intro",
              ".archive-gallery__intro",
              ".section-heading",
              ".historical-contact__source"
            ].map((selector) => {
              const el = document.querySelector(selector);
              if (!el) return { selector, missing: true };
              return { selector, position: getComputedStyle(el).position, top: parseFloat(getComputedStyle(el).top) };
            });
            return {
              headerHeight: header.getBoundingClientRect().height,
              heroPresent: Boolean(hero),
              contextPresent: Boolean(context),
              markPresent: Boolean(mark),
              sticky
            };
          })()`);
          evidence.contactBoundary = await evaluate('document.querySelector("#contacto")?.textContent?.includes("Recolección de datos 2026") ?? false');
          evidence.teamBoundary = await evaluate('document.querySelector("#equipo")?.textContent?.includes("No confirma pertenencia, colaboración, rol ni vínculo vigente") ?? false');

          await send("Page.reload", { ignoreCache: true });
          await sleep(500);
          await setViewport(1440, 1000);
          await evaluate("window.scrollTo(0, 0); document.activeElement?.blur?.()");
          await send("Input.dispatchKeyEvent", { type: "keyDown", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          await send("Input.dispatchKeyEvent", { type: "keyUp", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          evidence.firstTab = await evaluate(`(() => ({ text: document.activeElement?.textContent?.replace(/\\s+/g, " ").trim() ?? null, href: document.activeElement?.getAttribute?.("href") ?? null }))()`);
          await send("Emulation.setEmulatedMedia", { features: [{ name: "prefers-reduced-motion", value: "reduce" }] });
          evidence.reducedMotion = await evaluate(`(() => ({ scrollBehavior: getComputedStyle(document.documentElement).scrollBehavior, transitionDuration: getComputedStyle(document.querySelector(".button")).transitionDuration }))()`);

          const failures = [];
          if (evidence.h1Count !== 1) failures.push(`Expected one H1, found ${evidence.h1Count}`);
          if (Object.values(evidence.viewports).some((viewport) => viewport.documentOverflow)) failures.push("Document-level horizontal overflow detected");
          if (!evidence.images.length || evidence.images.some((image) => !image.complete || image.naturalWidth <= 0)) failures.push("Promoted image failed after lazy-load traversal");
          const mobile = evidence.viewports["mobile-360"];
          if (mobile.nav.display === "none" || mobile.nav.linkCount !== 6 || !mobile.nav.fullyInsideViewport) failures.push(`Mobile navigation contract failed: ${JSON.stringify(mobile.nav)}`);
          if (mobile.headerPosition === "sticky") failures.push("Mobile header should remain non-sticky to preserve viewport space");
          if (evidence.viewports["desktop-1440"].headerPosition !== "sticky") failures.push("Desktop header is not sticky");
          if (!evidence.shell.heroPresent || !evidence.shell.contextPresent || !evidence.shell.markPresent) failures.push("Hero archival shell is incomplete");
          if (evidence.shell.sticky.some((entry) => entry.missing || entry.position !== "sticky" || entry.top < evidence.shell.headerHeight + 8)) failures.push(`Sticky offset contract failed: ${JSON.stringify(evidence.shell)}`);
          if (!evidence.contactBoundary) failures.push("Contacto privacy boundary missing");
          if (!evidence.teamBoundary) failures.push("Equipo truth boundary missing");
          if (evidence.firstTab?.href !== "#main-content") failures.push(`First Tab mismatch: ${JSON.stringify(evidence.firstTab)}`);
          if (evidence.reducedMotion?.scrollBehavior !== "auto") failures.push("Reduced motion did not disable smooth scrolling");

          evidence.failures = failures;
          await fs.writeFile("visual-qa/evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          socket.close();
          if (failures.length) throw new Error(failures.join("; "));
          NODE

          node visual-qa/capture.mjs

      - name: Upload visual shell evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-shell-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
