name: Home visual smoke once

on:
  push:
    branches:
      - modernize/2026-home
    paths:
      - .github/workflows/home-visual-smoke-once.yml

permissions:
  contents: read

concurrency:
  group: home-visual-smoke-once
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out Home branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-home

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install and build
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Serve production build
        run: |
          mkdir -p visual-qa
          cd modern
          pnpm preview --host 127.0.0.1 --port 4173 > ../visual-qa/preview.log 2>&1 &
          echo $! > ../visual-qa/preview.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat ../visual-qa/preview.log
          exit 1

      - name: Capture and validate Home through Chrome DevTools
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No supported Chrome/Chromium binary found on runner."
            exit 1
          fi

          "$CHROME_BIN" --version | tee visual-qa/browser-version.txt

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/el-nucleo-cdp \
            http://127.0.0.1:4173/ \
            > visual-qa/chrome.log 2>&1 &
          echo $! > visual-qa/chrome.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9222/json/list > /dev/null; then
              break
            fi
            sleep 1
          done

          cat > visual-qa/capture.mjs <<'NODE'
          import fs from "node:fs/promises";

          const pageUrl = "http://127.0.0.1:4173/";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const targets = await fetch("http://127.0.0.1:9222/json/list").then((response) => response.json());
          const target = targets.find((candidate) => candidate.type === "page");

          if (!target?.webSocketDebuggerUrl) {
            throw new Error("Chrome page target was not available through CDP.");
          }

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let nextId = 1;
          const pending = new Map();

          socket.addEventListener("message", (event) => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) {
              waiter.reject(new Error(`${message.error.code}: ${message.error.message}`));
            } else {
              waiter.resolve(message.result ?? {});
            }
          });

          const send = (method, params = {}) =>
            new Promise((resolve, reject) => {
              const id = nextId++;
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
            });

          const evaluate = async (expression) => {
            const result = await send("Runtime.evaluate", {
              expression,
              awaitPromise: true,
              returnByValue: true,
            });
            return result.result?.value;
          };

          const resetPage = async () => {
            await send("Page.navigate", { url: pageUrl });
            await sleep(700);
          };

          const setViewport = async (width, height) => {
            await send("Emulation.setDeviceMetricsOverride", {
              width,
              height,
              deviceScaleFactor: 1,
              mobile: false,
              screenWidth: width,
              screenHeight: height,
            });
            await evaluate("window.scrollTo(0, 0)");
            await sleep(350);
          };

          const captureViewport = async (name) => {
            const result = await send("Page.captureScreenshot", { format: "png", fromSurface: true });
            await fs.writeFile(`visual-qa/${name}.png`, Buffer.from(result.data, "base64"));
          };

          const captureFullPage = async (name) => {
            const metrics = await send("Page.getLayoutMetrics");
            const content = metrics.cssContentSize ?? metrics.contentSize;
            const result = await send("Page.captureScreenshot", {
              format: "png",
              fromSurface: true,
              captureBeyondViewport: true,
              clip: { x: 0, y: 0, width: content.width, height: content.height, scale: 1 },
            });
            await fs.writeFile(`visual-qa/${name}.png`, Buffer.from(result.data, "base64"));
            return { width: content.width, height: content.height };
          };

          const scrollTo = async (selector) => {
            const found = await evaluate(`(() => {
              const element = document.querySelector(${JSON.stringify(selector)});
              if (!element) return false;
              element.scrollIntoView({ block: "center", inline: "nearest", behavior: "instant" });
              return true;
            })()`);
            if (!found) throw new Error(`Could not find ${selector}`);
            await sleep(300);
          };

          const clickNext = async () => {
            const clicked = await evaluate(`(() => {
              const button = [...document.querySelectorAll("button")]
                .find((candidate) => candidate.textContent?.trim().includes("Siguiente"));
              if (!button) return false;
              button.click();
              return true;
            })()`);
            if (!clicked) throw new Error("Gallery next button was not found.");
            await sleep(300);
          };

          const activeGalleryText = () =>
            evaluate(`(() => document.querySelector('[aria-live]')?.textContent?.replace(/\\s+/g, " ").trim() ?? null)()`);

          const pressTab = async () => {
            const event = { key: "Tab", code: "Tab", windowsVirtualKeyCode: 9, nativeVirtualKeyCode: 9 };
            await send("Input.dispatchKeyEvent", { type: "keyDown", ...event });
            await send("Input.dispatchKeyEvent", { type: "keyUp", ...event });
            await sleep(120);
          };

          const activeElement = () =>
            evaluate(`(() => {
              const element = document.activeElement;
              if (!element) return null;
              return {
                tag: element.tagName,
                text: (element.textContent ?? "").replace(/\\s+/g, " ").trim().slice(0, 120),
                href: element.getAttribute("href"),
                ariaLabel: element.getAttribute("aria-label"),
                className: typeof element.className === "string" ? element.className : null,
              };
            })()`);

          await send("Page.enable");
          await send("Runtime.enable");
          await sleep(500);

          const evidence = {
            url: await evaluate("location.href"),
            title: await evaluate("document.title"),
            viewports: {},
            gallery: {},
            keyboard: {},
            reducedMotion: {},
          };

          for (const viewport of [
            { name: "mobile-360", width: 360, height: 900 },
            { name: "tablet-768", width: 768, height: 1024 },
            { name: "desktop-1440", width: 1440, height: 1000 },
          ]) {
            await resetPage();
            await setViewport(viewport.width, viewport.height);
            await captureViewport(`hero-${viewport.name}`);
            evidence.viewports[viewport.name] = await captureFullPage(`full-${viewport.name}`);
            await scrollTo("#archivo");
            await captureViewport(`archive-${viewport.name}`);
            await scrollTo("#historia");
            await captureViewport(`history-${viewport.name}`);
          }

          for (const viewport of [
            { name: "mobile-360", width: 360, height: 900 },
            { name: "desktop-1440", width: 1440, height: 1000 },
          ]) {
            await resetPage();
            await setViewport(viewport.width, viewport.height);
            await scrollTo("#archivo");
            evidence.gallery[viewport.name] = [];
            for (let index = 1; index <= 4; index += 1) {
              evidence.gallery[viewport.name].push(await activeGalleryText());
              await captureViewport(`gallery-${viewport.name}-${index}`);
              if (index < 4) await clickNext();
            }
          }

          await resetPage();
          await setViewport(1440, 1000);
          await evaluate("document.activeElement?.blur(); window.scrollTo(0, 0)");
          evidence.keyboard.desktop = [];
          for (let index = 0; index < 8; index += 1) {
            await pressTab();
            evidence.keyboard.desktop.push(await activeElement());
            if (index === 0) await captureViewport("focus-first-tab-desktop");
          }

          await send("Emulation.setEmulatedMedia", {
            features: [{ name: "prefers-reduced-motion", value: "reduce" }],
          });
          evidence.reducedMotion = await evaluate(`(() => ({
            scrollBehavior: getComputedStyle(document.documentElement).scrollBehavior,
            primaryButtonTransitionDuration: getComputedStyle(document.querySelector('.button--primary')).transitionDuration,
          }))()`);
          await send("Emulation.setEmulatedMedia", { features: [] });

          evidence.h1Count = await evaluate('document.querySelectorAll("h1").length');
          await setViewport(1440, 1000);
          evidence.horizontalOverflowDesktop = await evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth");
          await setViewport(360, 900);
          evidence.horizontalOverflowMobile = await evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth");

          const expectedGallery = [
            "1 de 4 — Videoclips",
            "2 de 4 — Publicidad",
            "3 de 4 — Cortometrajes",
            "4 de 4 — Coberturas",
          ];

          for (const sequence of Object.values(evidence.gallery)) {
            if (JSON.stringify(sequence) !== JSON.stringify(expectedGallery)) {
              throw new Error(`Unexpected gallery sequence: ${JSON.stringify(sequence)}`);
            }
          }
          if (evidence.h1Count !== 1) throw new Error(`Expected one H1, got ${evidence.h1Count}`);
          if (evidence.horizontalOverflowDesktop || evidence.horizontalOverflowMobile) {
            throw new Error("Horizontal overflow detected in a required viewport.");
          }
          if (!evidence.keyboard.desktop[0]?.text?.includes("Saltar al contenido")) {
            throw new Error(`First Tab target is not the skip link: ${JSON.stringify(evidence.keyboard.desktop[0])}`);
          }
          if (evidence.reducedMotion.scrollBehavior !== "auto") {
            throw new Error(`Reduced-motion scroll behavior is ${evidence.reducedMotion.scrollBehavior}`);
          }

          await fs.writeFile("visual-qa/evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          socket.close();
          NODE

          node visual-qa/capture.mjs
          curl --fail --silent http://127.0.0.1:4173/ > visual-qa/rendered-index.html

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
