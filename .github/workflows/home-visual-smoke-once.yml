name: Home visual smoke once

on:
  push:
    branches:
      - modernize/2026-home
    paths:
      - .github/workflows/home-visual-smoke-once.yml

permissions:
  contents: read

concurrency:
  group: home-visual-smoke-once
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out Home branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-home

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install and build
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Serve production build
        run: |
          mkdir -p visual-qa
          cd modern
          pnpm preview --host 127.0.0.1 --port 4173 > ../visual-qa/preview.log 2>&1 &
          echo $! > ../visual-qa/preview.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat ../visual-qa/preview.log
          exit 1

      - name: Capture responsive evidence
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No supported Chrome/Chromium binary found on runner."
            exit 1
          fi

          "$CHROME_BIN" --version | tee visual-qa/browser-version.txt

          capture() {
            name="$1"
            width="$2"
            height="$3"
            suffix="$4"

            "$CHROME_BIN" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=2500 \
              --force-device-scale-factor=1 \
              --window-size="${width},${height}" \
              --screenshot="visual-qa/${name}.png" \
              "http://127.0.0.1:4173/${suffix}"
          }

          capture home-mobile-360 360 1000 ""
          capture home-tablet-768 768 1200 ""
          capture home-desktop-1440 1440 1200 ""

          capture archive-mobile-360 360 1000 "#archivo"
          capture archive-tablet-768 768 1200 "#archivo"
          capture archive-desktop-1440 1440 1200 "#archivo"

          capture history-mobile-360 360 1000 "#historia"
          capture history-desktop-1440 1440 1200 "#historia"

          curl --fail --silent http://127.0.0.1:4173/ > visual-qa/rendered-index.html
          printf '%s\n' \
            'Home responsive smoke evidence' \
            'branch=modernize/2026-home' \
            'hero=360x1000,768x1200,1440x1200' \
            'archive=360x1000,768x1200,1440x1200' \
            'history=360x1000,1440x1200' \
            'source=Vite production preview' \
            > visual-qa/manifest.txt

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
