name: Visual system browser smoke once

on:
  push:
    branches:
      - modernize/2026-visual-system
    paths:
      - .github/workflows/visual-system-smoke-once.yml

permissions:
  contents: read

concurrency:
  group: visual-system-browser-smoke-once
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out visual-system branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-visual-system

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install and build
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Serve production build
        run: |
          mkdir -p visual-qa
          cd modern
          pnpm preview --host 127.0.0.1 --port 4173 > ../visual-qa/preview.log 2>&1 &
          echo $! > ../visual-qa/preview.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat ../visual-qa/preview.log
          exit 1

      - name: Capture and validate visual system through Chrome DevTools
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No supported Chrome/Chromium binary found on runner."
            exit 1
          fi

          "$CHROME_BIN" --version | tee visual-qa/browser-version.txt

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/el-nucleo-visual-system-cdp \
            http://127.0.0.1:4173/ \
            > visual-qa/chrome.log 2>&1 &
          echo $! > visual-qa/chrome.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9222/json/list > /dev/null; then
              break
            fi
            sleep 1
          done

          cat > visual-qa/capture.mjs <<'NODE'
          import fs from "node:fs/promises";

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const targets = await fetch("http://127.0.0.1:9222/json/list").then((response) => response.json());
          const target = targets.find((candidate) => candidate.type === "page");
          if (!target?.webSocketDebuggerUrl) throw new Error("Chrome page target unavailable.");

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let nextId = 1;
          const pending = new Map();
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) waiter.reject(new Error(`${message.error.code}: ${message.error.message}`));
            else waiter.resolve(message.result ?? {});
          });

          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = nextId++;
            pending.set(id, { resolve, reject });
            socket.send(JSON.stringify({ id, method, params }));
          });

          const evaluate = async (expression) => {
            const result = await send("Runtime.evaluate", {
              expression,
              awaitPromise: true,
              returnByValue: true,
            });
            return result.result?.value;
          };

          const setViewport = async (width, height) => {
            await send("Emulation.setDeviceMetricsOverride", {
              width,
              height,
              deviceScaleFactor: 1,
              mobile: false,
              screenWidth: width,
              screenHeight: height,
            });
            await evaluate("window.scrollTo(0, 0)");
            await sleep(250);
          };

          const captureFullPage = async (name) => {
            const metrics = await send("Page.getLayoutMetrics");
            const content = metrics.cssContentSize ?? metrics.contentSize;
            const result = await send("Page.captureScreenshot", {
              format: "png",
              fromSurface: true,
              captureBeyondViewport: true,
              clip: { x: 0, y: 0, width: content.width, height: content.height, scale: 1 },
            });
            await fs.writeFile(`visual-qa/${name}.png`, Buffer.from(result.data, "base64"));
            return { width: content.width, height: content.height };
          };

          await send("Page.enable");
          await send("Runtime.enable");
          await sleep(650);

          const evidence = {
            url: await evaluate("location.href"),
            title: await evaluate("document.title"),
            viewports: {},
          };

          for (const viewport of [
            { name: "mobile-360", width: 360, height: 900 },
            { name: "tablet-768", width: 768, height: 1024 },
            { name: "desktop-1440", width: 1440, height: 1000 },
          ]) {
            await setViewport(viewport.width, viewport.height);
            evidence.viewports[viewport.name] = {
              page: await captureFullPage(`visual-system-${viewport.name}`),
              overflow: await evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth"),
            };
          }

          await setViewport(1440, 1000);
          evidence.h1Count = await evaluate('document.querySelectorAll("h1").length');
          evidence.images = await evaluate(`[...document.images].map((img) => ({
            alt: img.alt,
            complete: img.complete,
            naturalWidth: img.naturalWidth,
            src: img.getAttribute("src")
          }))`);
          evidence.sectionAlignment = await evaluate(`(() => {
            const selectors = [
              ".hero",
              ".about-section",
              ".archive-gallery",
              ".backstage-archive",
              ".historical-team",
              ".historical-contact",
              ".history-section",
              ".rebuild-section"
            ];
            return selectors.map((selector) => {
              const el = document.querySelector(selector);
              if (!el) return { selector, missing: true };
              const rect = el.getBoundingClientRect();
              return { selector, left: rect.left, right: rect.right, width: rect.width };
            });
          })()`);
          evidence.contactForms = await evaluate('document.querySelectorAll("#contacto form").length');
          evidence.contactControls = await evaluate('document.querySelectorAll("#contacto input, #contacto textarea, #contacto select, #contacto button").length');
          evidence.contactBoundary = await evaluate('document.querySelector("#contacto")?.textContent?.includes("Recolección de datos 2026") ?? false');
          evidence.teamBoundary = await evaluate('document.querySelector("#equipo")?.textContent?.includes("No confirma pertenencia, colaboración, rol ni vínculo vigente") ?? false');

          await send("Page.reload", { ignoreCache: true });
          await sleep(600);
          await setViewport(1440, 1000);
          await evaluate("window.scrollTo(0, 0); document.activeElement?.blur?.()");
          await send("Input.dispatchKeyEvent", { type: "keyDown", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          await send("Input.dispatchKeyEvent", { type: "keyUp", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          await sleep(150);
          evidence.firstTab = await evaluate(`(() => {
            const el = document.activeElement;
            return { text: el?.textContent?.replace(/\\s+/g, " ").trim() ?? null, href: el?.getAttribute?.("href") ?? null };
          })()`);

          await send("Emulation.setEmulatedMedia", {
            features: [{ name: "prefers-reduced-motion", value: "reduce" }],
          });
          evidence.reducedMotion = await evaluate(`(() => ({
            scrollBehavior: getComputedStyle(document.documentElement).scrollBehavior,
            buttonTransition: getComputedStyle(document.querySelector(".button")).transitionDuration
          }))()`);

          const failures = [];
          if (evidence.h1Count !== 1) failures.push(`Expected one H1, found ${evidence.h1Count}`);
          if (Object.values(evidence.viewports).some((viewport) => viewport.overflow)) failures.push("Horizontal overflow detected");
          if (evidence.images.length === 0 || evidence.images.some((image) => !image.complete || image.naturalWidth <= 0)) failures.push("One or more promoted images failed to load");
          if (evidence.sectionAlignment.some((entry) => entry.missing)) failures.push("A visual-system section selector is missing");
          const aligned = evidence.sectionAlignment.filter((entry) => !entry.missing);
          const minLeft = Math.min(...aligned.map((entry) => entry.left));
          const maxLeft = Math.max(...aligned.map((entry) => entry.left));
          if (maxLeft - minLeft > 1) failures.push(`Section left edges differ by ${maxLeft - minLeft}px`);
          if (evidence.contactForms !== 0 || evidence.contactControls !== 0) failures.push("Contacto regained an interactive transport surface");
          if (!evidence.contactBoundary) failures.push("Contacto privacy boundary missing");
          if (!evidence.teamBoundary) failures.push("Equipo truth boundary missing");
          if (evidence.firstTab?.href !== "#main-content") failures.push(`First Tab is not the skip link: ${JSON.stringify(evidence.firstTab)}`);
          if (evidence.reducedMotion?.scrollBehavior !== "auto") failures.push("Reduced motion did not disable smooth scrolling");

          evidence.failures = failures;
          await fs.writeFile("visual-qa/evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          socket.close();
          if (failures.length) throw new Error(failures.join("; "));
          NODE

          node visual-qa/capture.mjs

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-system-foundation-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
