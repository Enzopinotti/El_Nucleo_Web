name: Contacto canonical format once

on:
  push:
    branches:
      - modernize/2026-contacto
    paths:
      - .github/workflows/contacto-format-once.yml

permissions:
  contents: write

concurrency:
  group: contacto-format-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Contacto branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-contacto

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: modern
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier to Contacto-owned files
        working-directory: modern
        run: |
          pnpm exec prettier --write \
            README.md \
            src/App.test.tsx \
            src/components/HistoricalContact.tsx \
            src/content/historical-contact.ts \
            src/styles/_contact.scss

      - name: Commit canonical formatting when needed
        run: |
          if git diff --quiet -- modern/README.md modern/src/App.test.tsx modern/src/components/HistoricalContact.tsx modern/src/content/historical-contact.ts modern/src/styles/_contact.scss; then
            echo "Contacto files are already formatter-canonical."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern/README.md modern/src/App.test.tsx modern/src/components/HistoricalContact.tsx modern/src/content/historical-contact.ts modern/src/styles/_contact.scss
          git commit -m "chore(contacto): apply canonical formatting"
          git push origin HEAD:modernize/2026-contacto
