name: Visual sections browser smoke once

on:
  push:
    branches:
      - modernize/2026-visual-sections
    paths:
      - .github/workflows/visual-sections-smoke-once.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out visual sections branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-visual-sections

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install and build
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Serve production build
        run: |
          mkdir -p visual-qa
          cd modern
          pnpm preview --host 127.0.0.1 --port 4173 > ../visual-qa/preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat ../visual-qa/preview.log
          exit 1

      - name: Validate historical sections in production Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || { echo "Chrome/Chromium unavailable"; exit 1; }
          "$CHROME_BIN" --version | tee visual-qa/browser-version.txt
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/el-nucleo-visual-sections \
            http://127.0.0.1:4173/ > visual-qa/chrome.log 2>&1 &

          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9222/json/list > /dev/null && break
            sleep 1
          done

          cat > visual-qa/capture.mjs <<'NODE'
          import fs from "node:fs/promises";

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const targets = await fetch("http://127.0.0.1:9222/json/list").then((r) => r.json());
          const target = targets.find((candidate) => candidate.type === "page");
          if (!target?.webSocketDebuggerUrl) throw new Error("Chrome page target unavailable");

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(event.data);
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            message.error ? waiter.reject(new Error(message.error.message)) : waiter.resolve(message.result ?? {});
          });
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const next = ++id;
            pending.set(next, { resolve, reject });
            socket.send(JSON.stringify({ id: next, method, params }));
          });
          const evaluate = async (expression) => {
            const result = await send("Runtime.evaluate", { expression, awaitPromise: true, returnByValue: true });
            return result.result?.value;
          };
          const setViewport = async (width, height) => {
            await send("Emulation.setDeviceMetricsOverride", { width, height, deviceScaleFactor: 1, mobile: false, screenWidth: width, screenHeight: height });
            await evaluate("window.scrollTo(0, 0)");
            await sleep(220);
          };
          const warmImages = async () => evaluate(`(async () => {
            const images = [...document.images];
            for (const image of images) {
              image.scrollIntoView({ block: "center", behavior: "instant" });
              await new Promise((resolve) => setTimeout(resolve, 80));
            }
            await Promise.all(images.map((image) => image.complete ? Promise.resolve() : new Promise((resolve) => {
              image.addEventListener("load", resolve, { once: true });
              image.addEventListener("error", resolve, { once: true });
              setTimeout(resolve, 1800);
            })));
            window.scrollTo(0, 0);
            await new Promise((resolve) => setTimeout(resolve, 200));
          })()`);
          const screenshot = async (name) => {
            const metrics = await send("Page.getLayoutMetrics");
            const content = metrics.cssContentSize ?? metrics.contentSize;
            const shot = await send("Page.captureScreenshot", { format: "png", fromSurface: true, captureBeyondViewport: true, clip: { x: 0, y: 0, width: content.width, height: content.height, scale: 1 } });
            await fs.writeFile(`visual-qa/${name}.png`, Buffer.from(shot.data, "base64"));
            return { width: content.width, height: content.height };
          };

          await send("Page.enable");
          await send("Runtime.enable");
          await sleep(500);

          const evidence = { viewports: {} };
          for (const viewport of [
            { name: "mobile-360", width: 360, height: 900 },
            { name: "tablet-768", width: 768, height: 1024 },
            { name: "desktop-1440", width: 1440, height: 1000 },
          ]) {
            await setViewport(viewport.width, viewport.height);
            await warmImages();
            evidence.viewports[viewport.name] = {
              page: await screenshot(`visual-sections-${viewport.name}`),
              overflow: await evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth"),
              sectionRects: await evaluate(`(() => ["#nosotros", "#servicios", "#backstage", "#equipo", "#contacto"].map((selector) => {
                const el = document.querySelector(selector);
                if (!el) return { selector, missing: true };
                const rect = el.getBoundingClientRect();
                return { selector, width: rect.width, left: rect.left, right: rect.right, height: rect.height };
              }))()`)
            };
          }

          await setViewport(1440, 1000);
          await warmImages();
          evidence.images = await evaluate(`[...document.images].map((img) => ({ complete: img.complete, naturalWidth: img.naturalWidth, alt: img.alt }))`);
          evidence.counts = await evaluate(`(() => ({
            aboutCards: document.querySelectorAll(".about-archive-card").length,
            backstageCards: document.querySelectorAll(".backstage-card").length,
            people: document.querySelectorAll(".historical-person").length,
            clientReferences: document.querySelectorAll(".historical-clients__list li").length,
            contactFields: document.querySelectorAll(".historical-contact__field").length,
            contactForms: document.querySelectorAll("#contacto form").length,
            contactControls: document.querySelectorAll("#contacto input, #contacto textarea, #contacto select, #contacto button").length
          }))()`);
          evidence.boundaries = await evaluate(`(() => ({
            about: document.querySelector("#nosotros")?.textContent?.includes("Vigencia 2026") ?? false,
            backstage: document.querySelector("#backstage")?.textContent?.includes("no confirma equipo") ?? false,
            team: document.querySelector("#equipo")?.textContent?.includes("No confirma pertenencia, colaboración, rol ni vínculo vigente") ?? false,
            contact: document.querySelector("#contacto")?.textContent?.includes("Recolección de datos 2026") ?? false
          }))()`);
          evidence.clipping = await evaluate(`(() => [...document.querySelectorAll(".about-archive-card, .backstage-card, .historical-person, .historical-contact__field")].map((el) => ({ className: el.className, verticalClip: el.scrollHeight > el.clientHeight + 1, horizontalClip: el.scrollWidth > el.clientWidth + 1 })))()`);

          await send("Page.reload", { ignoreCache: true });
          await sleep(500);
          await setViewport(1440, 1000);
          await evaluate("window.scrollTo(0, 0); document.activeElement?.blur?.()");
          await send("Input.dispatchKeyEvent", { type: "keyDown", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          await send("Input.dispatchKeyEvent", { type: "keyUp", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          evidence.firstTab = await evaluate(`(() => ({ href: document.activeElement?.getAttribute?.("href") ?? null, text: document.activeElement?.textContent?.replace(/\\s+/g, " ").trim() ?? null }))()`);
          await send("Emulation.setEmulatedMedia", { features: [{ name: "prefers-reduced-motion", value: "reduce" }] });
          evidence.reducedMotion = await evaluate('getComputedStyle(document.documentElement).scrollBehavior');

          const failures = [];
          if (Object.values(evidence.viewports).some((viewport) => viewport.overflow)) failures.push("Document overflow detected");
          if (Object.values(evidence.viewports).some((viewport) => viewport.sectionRects.some((section) => section.missing || section.left < -0.5 || section.right > viewport.page.width + 0.5))) failures.push("Section escaped qualified viewport");
          if (!evidence.images.length || evidence.images.some((image) => !image.complete || image.naturalWidth <= 0)) failures.push("Historical image failed to load");
          if (evidence.counts.aboutCards !== 3 || evidence.counts.backstageCards !== 4 || evidence.counts.people !== 2 || evidence.counts.clientReferences !== 2 || evidence.counts.contactFields !== 5) failures.push(`Historical surface counts changed: ${JSON.stringify(evidence.counts)}`);
          if (evidence.counts.contactForms !== 0 || evidence.counts.contactControls !== 0) failures.push("Contacto regained interactive controls");
          if (Object.values(evidence.boundaries).some((value) => !value)) failures.push(`Truth boundary missing: ${JSON.stringify(evidence.boundaries)}`);
          if (evidence.clipping.some((entry) => entry.verticalClip || entry.horizontalClip)) failures.push(`Card clipping detected: ${JSON.stringify(evidence.clipping.filter((entry) => entry.verticalClip || entry.horizontalClip))}`);
          if (evidence.firstTab?.href !== "#main-content") failures.push(`First Tab mismatch: ${JSON.stringify(evidence.firstTab)}`);
          if (evidence.reducedMotion !== "auto") failures.push("Reduced-motion scroll contract failed");

          evidence.failures = failures;
          await fs.writeFile("visual-qa/evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          socket.close();
          if (failures.length) throw new Error(failures.join("; "));
          NODE

          node visual-qa/capture.mjs

      - name: Upload section visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-sections-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
