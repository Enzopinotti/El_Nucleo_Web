name: Home format once

on:
  push:
    branches:
      - modernize/2026-home
    paths:
      - .github/workflows/home-format-once.yml

permissions:
  contents: write

concurrency:
  group: home-format-once
  cancel-in-progress: true

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out Home branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-home
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: modern
        run: pnpm install --frozen-lockfile

      - name: Format and validate Home
        working-directory: modern
        run: |
          pnpm format
          pnpm check

      - name: Commit canonical output and remove this one-shot workflow
        run: |
          git rm .github/workflows/home-format-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A modern .github/workflows

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "chore(home): apply canonical formatting after validation"
          git push origin HEAD:modernize/2026-home
