name: Dependency audit once

on:
  push:
    branches:
      - chore/2026-repository-hardening-audit
    paths:
      - .github/workflows/dependency-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: modern

    steps:
      - name: Check out hardening branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/2026-repository-hardening-audit

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ../.nvmrc

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies at moderate severity
        run: pnpm audit --prod --audit-level=moderate

      - name: Audit complete dependency graph at high severity
        run: pnpm audit --audit-level=high
