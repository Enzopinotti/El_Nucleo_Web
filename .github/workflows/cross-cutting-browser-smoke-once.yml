name: Cross-cutting browser smoke once

on:
  push:
    branches:
      - modernize/2026-cross-cutting-quality
    paths:
      - .github/workflows/cross-cutting-browser-smoke-once.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out cross-cutting branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-cross-cutting-quality

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install and build
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Serve production build
        run: |
          mkdir -p cross-cutting-qa
          cd modern
          pnpm preview --host 127.0.0.1 --port 4173 > ../cross-cutting-qa/preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat ../cross-cutting-qa/preview.log
          exit 1

      - name: Qualify production document in Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || { echo "Chrome/Chromium unavailable"; exit 1; }
          "$CHROME_BIN" --version | tee cross-cutting-qa/browser-version.txt
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/el-nucleo-cross-cutting \
            http://127.0.0.1:4173/ > cross-cutting-qa/chrome.log 2>&1 &

          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9222/json/list > /dev/null && break
            sleep 1
          done

          cat > cross-cutting-qa/capture.mjs <<'NODE'
          import fs from "node:fs/promises";

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const targets = await fetch("http://127.0.0.1:9222/json/list").then((r) => r.json());
          const target = targets.find((candidate) => candidate.type === "page");
          if (!target?.webSocketDebuggerUrl) throw new Error("Chrome page target unavailable");

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(event.data);
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            message.error ? waiter.reject(new Error(message.error.message)) : waiter.resolve(message.result ?? {});
          });
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const next = ++id;
            pending.set(next, { resolve, reject });
            socket.send(JSON.stringify({ id: next, method, params }));
          });
          const evaluate = async (expression) => {
            const result = await send("Runtime.evaluate", { expression, awaitPromise: true, returnByValue: true });
            if (result.exceptionDetails) throw new Error(result.exceptionDetails.text ?? "Runtime.evaluate failed");
            return result.result?.value;
          };
          const setViewport = async (width, height) => {
            await send("Emulation.setDeviceMetricsOverride", {
              width,
              height,
              deviceScaleFactor: 1,
              mobile: false,
              screenWidth: width,
              screenHeight: height,
            });
            await evaluate("window.scrollTo(0, 0)");
            await sleep(180);
          };
          const warmImages = async () => evaluate(`(async () => {
            const images = [...document.images];
            for (const image of images) {
              image.scrollIntoView({ block: "center", behavior: "instant" });
              await new Promise((resolve) => setTimeout(resolve, 70));
            }
            await Promise.all(images.map((image) => image.complete ? Promise.resolve() : new Promise((resolve) => {
              image.addEventListener("load", resolve, { once: true });
              image.addEventListener("error", resolve, { once: true });
              setTimeout(resolve, 1800);
            })));
            window.scrollTo(0, 0);
            await new Promise((resolve) => setTimeout(resolve, 180));
          })()`);
          const screenshot = async (name) => {
            const metrics = await send("Page.getLayoutMetrics");
            const content = metrics.cssContentSize ?? metrics.contentSize;
            const shot = await send("Page.captureScreenshot", {
              format: "png",
              fromSurface: true,
              captureBeyondViewport: true,
              clip: { x: 0, y: 0, width: content.width, height: content.height, scale: 1 },
            });
            await fs.writeFile(`cross-cutting-qa/${name}.png`, Buffer.from(shot.data, "base64"));
            return { width: content.width, height: content.height };
          };

          await send("Page.enable");
          await send("Runtime.enable");
          await sleep(450);

          const evidence = { viewports: {} };
          for (const viewport of [
            { name: "mobile-360", width: 360, height: 900 },
            { name: "tablet-768", width: 768, height: 1024 },
            { name: "desktop-1440", width: 1440, height: 1000 },
          ]) {
            await setViewport(viewport.width, viewport.height);
            await warmImages();
            evidence.viewports[viewport.name] = {
              page: await screenshot(`cross-cutting-${viewport.name}`),
              overflow: await evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth"),
              landmarks: await evaluate(`(() => ({
                h1: document.querySelectorAll("h1").length,
                header: document.querySelectorAll("header").length,
                nav: document.querySelectorAll('nav[aria-label="Navegación principal"]').length,
                main: document.querySelectorAll("main#main-content").length,
                footer: document.querySelectorAll("footer").length
              }))()`),
            };
          }

          await setViewport(1440, 1000);
          await warmImages();

          evidence.metadata = await evaluate(`(() => ({
            lang: document.documentElement.lang,
            title: document.title,
            description: document.querySelector('meta[name="description"]')?.content ?? null,
            ogSiteName: document.querySelector('meta[property="og:site_name"]')?.content ?? null,
            ogLocale: document.querySelector('meta[property="og:locale"]')?.content ?? null,
            twitterCard: document.querySelector('meta[name="twitter:card"]')?.content ?? null,
            keywords: document.querySelector('meta[name="keywords"]')?.content ?? null,
            canonical: document.querySelector('link[rel="canonical"]')?.href ?? null,
            ogUrl: document.querySelector('meta[property="og:url"]')?.content ?? null,
            ogImage: document.querySelector('meta[property="og:image"]')?.content ?? null
          }))()`);

          evidence.fragments = await evaluate(`(() => [...document.querySelectorAll('nav[aria-label="Navegación principal"] a[href^="#"]')].map((link) => ({
            href: link.getAttribute("href"),
            targetExists: Boolean(document.querySelector(link.getAttribute("href")))
          })))()`);

          evidence.images = await evaluate(`(() => [...document.images].map((img) => ({
            src: img.getAttribute("src"),
            resolved: img.currentSrc || img.src,
            complete: img.complete,
            naturalWidth: img.naturalWidth,
            alt: img.alt,
            loading: img.getAttribute("loading"),
            hero: Boolean(img.closest(".hero__mark"))
          })))()`);

          evidence.contact = await evaluate(`(() => {
            const contact = document.querySelector("#contacto");
            return {
              exists: Boolean(contact),
              forms: contact?.querySelectorAll("form").length ?? -1,
              controls: contact?.querySelectorAll("input, textarea, select, button").length ?? -1
            };
          })()`);

          evidence.contrast = await evaluate(`(() => {
            const root = getComputedStyle(document.documentElement);
            const read = (name) => root.getPropertyValue(name).trim();
            const rgb = (hex) => {
              const value = hex.replace("#", "");
              if (!/^[0-9a-f]{6}$/i.test(value)) return null;
              return [0, 2, 4].map((offset) => Number.parseInt(value.slice(offset, offset + 2), 16) / 255);
            };
            const luminance = (hex) => {
              const channels = rgb(hex);
              if (!channels) return null;
              const linear = channels.map((channel) => channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4);
              return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
            };
            const ratio = (foreground, background) => {
              const a = luminance(foreground);
              const b = luminance(background);
              if (a == null || b == null) return null;
              const lighter = Math.max(a, b);
              const darker = Math.min(a, b);
              return (lighter + 0.05) / (darker + 0.05);
            };
            const pairs = [
              ["text/bg", "--color-text", "--color-bg"],
              ["muted/bg", "--color-muted", "--color-bg"],
              ["subtle/bg", "--color-subtle", "--color-bg"],
              ["accent/bg", "--color-accent", "--color-bg"],
              ["accentInk/accent", "--color-accent-ink", "--color-accent"],
              ["subtle/surface", "--color-subtle", "--color-surface"]
            ];
            return pairs.map(([name, fgToken, bgToken]) => {
              const foreground = read(fgToken);
              const background = read(bgToken);
              return { name, foreground, background, ratio: ratio(foreground, background) };
            });
          })()`);

          await send("Page.reload", { ignoreCache: true });
          await sleep(450);
          await setViewport(1440, 1000);
          await evaluate("window.scrollTo(0, 0); document.activeElement?.blur?.()");
          await send("Input.dispatchKeyEvent", { type: "keyDown", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          await send("Input.dispatchKeyEvent", { type: "keyUp", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          evidence.firstTab = await evaluate(`(() => ({
            href: document.activeElement?.getAttribute?.("href") ?? null,
            text: document.activeElement?.textContent?.replace(/\\s+/g, " ").trim() ?? null
          }))()`);

          await send("Emulation.setEmulatedMedia", {
            features: [{ name: "prefers-reduced-motion", value: "reduce" }],
          });
          evidence.reducedMotion = await evaluate("getComputedStyle(document.documentElement).scrollBehavior");

          const failures = [];
          if (Object.values(evidence.viewports).some((viewport) => viewport.overflow)) failures.push("Document overflow detected");
          if (Object.values(evidence.viewports).some((viewport) => Object.values(viewport.landmarks).some((count) => count !== 1))) failures.push(`Landmark/H1 count mismatch: ${JSON.stringify(evidence.viewports)}`);
          if (!evidence.fragments.length || evidence.fragments.some((fragment) => !fragment.targetExists)) failures.push(`Broken navigation fragment: ${JSON.stringify(evidence.fragments)}`);
          if (!evidence.images.length || evidence.images.some((image) => !image.complete || image.naturalWidth <= 0 || !image.alt.trim())) failures.push("Promoted image load/alt contract failed");
          if (evidence.images.some((image) => /^https?:\/\//i.test(image.src ?? ""))) failures.push("External essential image dependency detected");
          if (evidence.images.some((image) => !image.hero && image.loading !== "lazy")) failures.push("Below-fold image is not lazy");
          if (!evidence.contact.exists || evidence.contact.forms !== 0 || evidence.contact.controls !== 0) failures.push(`Contacto interactive boundary failed: ${JSON.stringify(evidence.contact)}`);
          if (evidence.metadata.lang !== "es" || !evidence.metadata.description || evidence.metadata.ogSiteName !== "El Núcleo — CINE" || evidence.metadata.ogLocale !== "es_AR" || evidence.metadata.twitterCard !== "summary") failures.push(`Metadata authority failed: ${JSON.stringify(evidence.metadata)}`);
          if (evidence.metadata.keywords || evidence.metadata.canonical || evidence.metadata.ogUrl || evidence.metadata.ogImage) failures.push(`Deferred metadata appeared before deployment authority: ${JSON.stringify(evidence.metadata)}`);
          if (evidence.firstTab?.href !== "#main-content") failures.push(`First Tab mismatch: ${JSON.stringify(evidence.firstTab)}`);
          if (evidence.reducedMotion !== "auto") failures.push(`Reduced-motion scroll contract failed: ${evidence.reducedMotion}`);
          if (evidence.contrast.some((pair) => pair.ratio == null || pair.ratio < 4.5)) failures.push(`Core contrast pair below 4.5:1: ${JSON.stringify(evidence.contrast)}`);

          evidence.failures = failures;
          await fs.writeFile("cross-cutting-qa/evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          socket.close();
          if (failures.length) throw new Error(failures.join("; "));
          NODE

          node cross-cutting-qa/capture.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-cutting-2026-qa
          path: cross-cutting-qa/
          if-no-files-found: error
          retention-days: 7
