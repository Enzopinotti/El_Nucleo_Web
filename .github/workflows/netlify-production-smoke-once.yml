name: Netlify production smoke once

on:
  push:
    branches:
      - release/2026-production-cutover
    paths:
      - .github/workflows/netlify-production-smoke-once.yml

permissions:
  contents: read

jobs:
  smoke-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out evidence branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Wait for production cutover
        shell: bash
        run: |
          set -euo pipefail

          target="https://el-nucleo-producciones.netlify.app"
          expected_title='El Núcleo | CINE — Archivo y reconstrucción 2026'
          expected_canonical='https://el-nucleo-producciones.netlify.app/'

          for attempt in $(seq 1 60); do
            body="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 "$target/" || true)"
            if printf '%s' "$body" | grep -Fq "<title>$expected_title</title>" \
              && printf '%s' "$body" | grep -Fq 'rel="canonical"' \
              && printf '%s' "$body" | grep -Fq "$expected_canonical"; then
              echo "Production is serving the modern 2026 cutover."
              exit 0
            fi

            echo "Production still waiting for modern cutover (attempt $attempt/60)."
            sleep 5
          done

          echo "Production did not reach the modern cutover within the qualification window."
          exit 1

      - name: Verify production document, metadata, assets and headers
        shell: bash
        run: |
          set -euo pipefail

          target="https://el-nucleo-producciones.netlify.app"
          production="https://el-nucleo-producciones.netlify.app/"
          social="${production}media/el-nucleo-logo.png"
          work="${RUNNER_TEMP}/netlify-production-smoke"
          mkdir -p "$work"

          curl --fail --silent --show-error --location \
            --dump-header "$work/document.headers" \
            --output "$work/document.html" \
            "$target/"

          tr -d '\r' < "$work/document.headers" > "$work/document.headers.normalized"

          grep -Fq '<title>El Núcleo | CINE — Archivo y reconstrucción 2026</title>' "$work/document.html"
          grep -Fq 'rel="canonical"' "$work/document.html"
          grep -Fq "href=\"$production\"" "$work/document.html"
          grep -Fq 'property="og:url"' "$work/document.html"
          grep -Fq "content=\"$production\"" "$work/document.html"
          grep -Fq 'property="og:image"' "$work/document.html"
          grep -Fq "content=\"$social\"" "$work/document.html"
          grep -Fq 'name="twitter:image"' "$work/document.html"
          grep -Eq 'src="/assets/[^\"]+\.js"' "$work/document.html"
          grep -Eq 'href="/assets/[^\"]+\.css"' "$work/document.html"

          grep -Eiq '^content-security-policy: .*default-src .self.' "$work/document.headers.normalized"
          grep -Eiq '^content-security-policy: .*form-action .none.' "$work/document.headers.normalized"
          grep -Eiq '^permissions-policy: .*camera=\(\).*microphone=\(\).*geolocation=\(\)' "$work/document.headers.normalized"
          grep -Eiq '^referrer-policy: strict-origin-when-cross-origin' "$work/document.headers.normalized"
          grep -Eiq '^x-content-type-options: nosniff' "$work/document.headers.normalized"
          grep -Eiq '^x-frame-options: DENY' "$work/document.headers.normalized"

          js_asset="$(grep -oE 'src="/assets/[^\"]+\.js"' "$work/document.html" | head -n 1 | cut -d'"' -f2)"
          css_asset="$(grep -oE 'href="/assets/[^\"]+\.css"' "$work/document.html" | head -n 1 | cut -d'"' -f2)"

          curl --fail --silent --show-error --location --output /dev/null "$target$js_asset"
          curl --fail --silent --show-error --location --output /dev/null "$target$css_asset"
          curl --fail --silent --show-error --location --output /dev/null "$target/media/el-nucleo-logo.png"

          curl --fail --silent --show-error --location --head "$target$js_asset" \
            | tr -d '\r' > "$work/asset.headers"
          grep -Eiq '^cache-control: .*max-age=31536000.*immutable' "$work/asset.headers"

      - name: Verify production robots and sitemap
        shell: bash
        run: |
          set -euo pipefail

          target="https://el-nucleo-producciones.netlify.app"
          production="https://el-nucleo-producciones.netlify.app/"

          robots="$(curl --fail --silent --show-error --location "$target/robots.txt")"
          printf '%s\n' "$robots" | grep -Fq 'User-agent: *'
          printf '%s\n' "$robots" | grep -Fq 'Allow: /'
          printf '%s\n' "$robots" | grep -Fq "Sitemap: ${production}sitemap.xml"

          sitemap="$(curl --fail --silent --show-error --location "$target/sitemap.xml")"
          printf '%s\n' "$sitemap" | grep -Fq "<loc>$production</loc>"
          count="$(printf '%s\n' "$sitemap" | grep -o '<loc>' | wc -l | tr -d ' ')"
          test "$count" = "1"

      - name: Verify production React render under CSP
        shell: bash
        run: |
          set -euo pipefail

          target="https://el-nucleo-producciones.netlify.app/"
          rendered="${RUNNER_TEMP}/netlify-production-rendered.html"

          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then
            echo "Google Chrome is not available on this runner."
            exit 1
          fi

          timeout 60s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --dump-dom \
            "$target" > "$rendered"

          grep -Fq 'Archivo 2022 · reconstrucción 2026' "$rendered"
          grep -Fq 'id="main-content"' "$rendered"
          grep -Fq 'id="nosotros"' "$rendered"
          grep -Fq 'id="servicios"' "$rendered"
          grep -Fq 'id="backstage"' "$rendered"
          grep -Fq 'id="equipo"' "$rendered"
          grep -Fq 'id="contacto"' "$rendered"
          grep -Fq 'id="historia"' "$rendered"

          if grep -Eiq '<form([ >])' "$rendered"; then
            echo "Unexpected live form rendered in Contacto archive."
            exit 1
          fi

          echo "Netlify production smoke passed for $target"
