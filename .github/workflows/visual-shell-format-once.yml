name: Visual shell format once

on:
  push:
    branches:
      - modernize/2026-visual-shell
    paths:
      - .github/workflows/visual-shell-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out visual shell branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-visual-shell

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: modern
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting only to shell files
        working-directory: modern
        run: pnpm exec prettier --write src/App.tsx src/styles/_base.scss src/styles/_home.scss

      - name: Commit canonical formatter output
        run: |
          if git diff --quiet -- modern/src/App.tsx modern/src/styles/_base.scss modern/src/styles/_home.scss; then
            echo "No formatter diff produced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern/src/App.tsx modern/src/styles/_base.scss modern/src/styles/_home.scss
          git commit -m "chore(styles): apply visual shell canonical formatting"
          git push origin HEAD:modernize/2026-visual-shell
