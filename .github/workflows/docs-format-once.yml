name: Docs formatter once

on:
  push:
    branches:
      - chore/2026-repository-hardening-audit
    paths:
      - .github/workflows/docs-format-once.yml

permissions:
  contents: write

jobs:
  format-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out hardening branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/2026-repository-hardening-audit

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: modern
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier formatting to repository docs
        working-directory: modern
        run: pnpm exec prettier --write "../README.md" "../docs/**/*.md"

      - name: Verify patch and commit only documentation formatting
        run: |
          git diff --check
          git status --short
          if git diff --quiet -- README.md docs; then
            echo "No documentation formatting changes required."
            exit 0
          fi
          git config user.name "Enzo Pinotti"
          git config user.email "enzopinottii@gmail.com"
          git add README.md docs
          git commit -m "style(docs): apply repository Prettier contract"
          git push origin HEAD:chore/2026-repository-hardening-audit
