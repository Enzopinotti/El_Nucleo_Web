name: Nosotros visual smoke once

on:
  push:
    branches:
      - modernize/2026-nosotros
    paths:
      - .github/workflows/nosotros-visual-smoke-once.yml

permissions:
  contents: read

concurrency:
  group: nosotros-visual-smoke-once
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out Nosotros branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-nosotros

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install and build
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Serve production build
        run: |
          mkdir -p visual-qa
          cd modern
          pnpm preview --host 127.0.0.1 --port 4173 > ../visual-qa/preview.log 2>&1 &
          echo $! > ../visual-qa/preview.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat ../visual-qa/preview.log
          exit 1

      - name: Capture and validate Nosotros through Chrome DevTools
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No supported Chrome/Chromium binary found on runner."
            exit 1
          fi

          "$CHROME_BIN" --version | tee visual-qa/browser-version.txt

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/el-nucleo-nosotros-cdp \
            http://127.0.0.1:4173/ \
            > visual-qa/chrome.log 2>&1 &
          echo $! > visual-qa/chrome.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9222/json/list > /dev/null; then
              break
            fi
            sleep 1
          done

          cat > visual-qa/capture.mjs <<'NODE'
          import fs from "node:fs/promises";

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const targets = await fetch("http://127.0.0.1:9222/json/list").then((response) => response.json());
          const target = targets.find((candidate) => candidate.type === "page");
          if (!target?.webSocketDebuggerUrl) throw new Error("Chrome page target unavailable.");

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let nextId = 1;
          const pending = new Map();
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) waiter.reject(new Error(`${message.error.code}: ${message.error.message}`));
            else waiter.resolve(message.result ?? {});
          });

          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = nextId++;
            pending.set(id, { resolve, reject });
            socket.send(JSON.stringify({ id, method, params }));
          });

          const evaluate = async (expression) => {
            const result = await send("Runtime.evaluate", {
              expression,
              awaitPromise: true,
              returnByValue: true,
            });
            return result.result?.value;
          };

          const setViewport = async (width, height) => {
            await send("Emulation.setDeviceMetricsOverride", {
              width,
              height,
              deviceScaleFactor: 1,
              mobile: false,
              screenWidth: width,
              screenHeight: height,
            });
            await evaluate("window.scrollTo(0, 0)");
            await sleep(250);
          };

          const captureViewport = async (name) => {
            const result = await send("Page.captureScreenshot", { format: "png", fromSurface: true });
            await fs.writeFile(`visual-qa/${name}.png`, Buffer.from(result.data, "base64"));
          };

          const captureFullPage = async (name) => {
            const metrics = await send("Page.getLayoutMetrics");
            const content = metrics.cssContentSize ?? metrics.contentSize;
            const result = await send("Page.captureScreenshot", {
              format: "png",
              fromSurface: true,
              captureBeyondViewport: true,
              clip: { x: 0, y: 0, width: content.width, height: content.height, scale: 1 },
            });
            await fs.writeFile(`visual-qa/${name}.png`, Buffer.from(result.data, "base64"));
            return { width: content.width, height: content.height };
          };

          const scrollTo = async (selector) => {
            const found = await evaluate(`(() => {
              const element = document.querySelector(${JSON.stringify(selector)});
              if (!element) return false;
              element.scrollIntoView({ block: "center", inline: "nearest", behavior: "instant" });
              return true;
            })()`);
            if (!found) throw new Error(`Missing selector: ${selector}`);
            await sleep(250);
          };

          await send("Page.enable");
          await send("Runtime.enable");
          await sleep(400);

          const evidence = {
            url: await evaluate("location.href"),
            title: await evaluate("document.title"),
            viewports: {},
          };

          for (const viewport of [
            { name: "mobile-360", width: 360, height: 900 },
            { name: "tablet-768", width: 768, height: 1024 },
            { name: "desktop-1440", width: 1440, height: 1000 },
          ]) {
            await setViewport(viewport.width, viewport.height);
            evidence.viewports[viewport.name] = await captureFullPage(`full-${viewport.name}`);
            await scrollTo("#nosotros");
            await captureViewport(`nosotros-${viewport.name}`);
          }

          await setViewport(1440, 1000);
          await evaluate("window.scrollTo(0, 0); document.body.focus?.()");
          await send("Input.dispatchKeyEvent", { type: "keyDown", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          await send("Input.dispatchKeyEvent", { type: "keyUp", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          await sleep(150);
          evidence.firstTab = await evaluate(`(() => {
            const el = document.activeElement;
            return { text: el?.textContent?.replace(/\\s+/g, " ").trim() ?? null, href: el?.getAttribute?.("href") ?? null };
          })()`);
          await captureViewport("focus-first-tab-desktop");

          evidence.h1Count = await evaluate('document.querySelectorAll("h1").length');
          evidence.aboutHeading = await evaluate('document.querySelector("#nosotros h2")?.textContent?.trim() ?? null');
          evidence.currentTruthBoundary = await evaluate('document.querySelector("#nosotros")?.textContent?.includes("No asumida") ?? false');
          evidence.unverifiedSocialLinks = await evaluate(`[...document.querySelectorAll("a")].filter((a) => /facebook|youtube|instagram|vimeo|twitter/i.test(a.href)).map((a) => a.href)`);

          await setViewport(1440, 1000);
          evidence.horizontalOverflowDesktop = await evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth");
          await setViewport(360, 900);
          evidence.horizontalOverflowMobile = await evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth");

          await send("Emulation.setEmulatedMedia", {
            features: [{ name: "prefers-reduced-motion", value: "reduce" }],
          });
          evidence.reducedMotion = await evaluate(`(() => ({
            scrollBehavior: getComputedStyle(document.documentElement).scrollBehavior,
            transitionDuration: getComputedStyle(document.querySelector(".button")).transitionDuration,
          }))()`);

          const failures = [];
          if (evidence.h1Count !== 1) failures.push(`Expected one H1, found ${evidence.h1Count}`);
          if (!evidence.aboutHeading) failures.push("Nosotros H2 missing");
          if (!evidence.currentTruthBoundary) failures.push("Current-truth boundary marker missing");
          if (evidence.unverifiedSocialLinks.length !== 0) failures.push("Unverified historical social links exposed");
          if (evidence.horizontalOverflowDesktop || evidence.horizontalOverflowMobile) failures.push("Horizontal overflow detected");
          if (evidence.firstTab?.href !== "#main-content") failures.push("First Tab is not the skip link");
          if (evidence.reducedMotion?.scrollBehavior !== "auto") failures.push("Reduced motion did not disable smooth scrolling");

          evidence.failures = failures;
          await fs.writeFile("visual-qa/evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          socket.close();
          if (failures.length) throw new Error(failures.join("; "));
          NODE

          node visual-qa/capture.mjs
          curl --fail --silent http://127.0.0.1:4173/ > visual-qa/rendered-index.html

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nosotros-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
