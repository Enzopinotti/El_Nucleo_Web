name: Netlify preview smoke once

on:
  push:
    branches:
      - release/2026-production-cutover
    paths:
      - .github/workflows/netlify-preview-smoke-once.yml

permissions:
  contents: read

jobs:
  smoke-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out cutover branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify deployed document, assets and security headers
        shell: bash
        run: |
          set -euo pipefail

          target="https://deploy-preview-32--el-nucleo-producciones.netlify.app"
          work="${RUNNER_TEMP}/netlify-preview-smoke"
          mkdir -p "$work"

          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --dump-header "$work/document.headers" \
            --output "$work/document.html" \
            "$target/"

          tr -d '\r' < "$work/document.headers" > "$work/document.headers.normalized"

          grep -Fq '<title>El Núcleo | CINE — Archivo y reconstrucción 2026</title>' "$work/document.html"
          grep -Eq 'src="/assets/[^\"]+\.js"' "$work/document.html"
          grep -Eq 'href="/assets/[^\"]+\.css"' "$work/document.html"

          ! grep -Eq '<link[^>]+rel="canonical"' "$work/document.html"
          ! grep -Eq '<meta[^>]+property="og:url"' "$work/document.html"
          ! grep -Eq '<meta[^>]+property="og:image"' "$work/document.html"

          grep -Eiq '^content-security-policy: .*default-src .self.' "$work/document.headers.normalized"
          grep -Eiq '^content-security-policy: .*form-action .none.' "$work/document.headers.normalized"
          grep -Eiq '^permissions-policy: .*camera=\(\).*microphone=\(\).*geolocation=\(\)' "$work/document.headers.normalized"
          grep -Eiq '^referrer-policy: strict-origin-when-cross-origin' "$work/document.headers.normalized"
          grep -Eiq '^x-content-type-options: nosniff' "$work/document.headers.normalized"
          grep -Eiq '^x-frame-options: DENY' "$work/document.headers.normalized"

          js_asset="$(grep -oE 'src="/assets/[^\"]+\.js"' "$work/document.html" | head -n 1 | cut -d'"' -f2)"
          css_asset="$(grep -oE 'href="/assets/[^\"]+\.css"' "$work/document.html" | head -n 1 | cut -d'"' -f2)"

          curl --fail --silent --show-error --location --output /dev/null "$target$js_asset"
          curl --fail --silent --show-error --location --output /dev/null "$target$css_asset"

          curl --fail --silent --show-error --location --head "$target$js_asset" \
            | tr -d '\r' > "$work/asset.headers"
          grep -Eiq '^cache-control: .*max-age=31536000.*immutable' "$work/asset.headers"

      - name: Verify the application renders under the enforced CSP
        shell: bash
        run: |
          set -euo pipefail

          target="https://deploy-preview-32--el-nucleo-producciones.netlify.app"
          rendered="${RUNNER_TEMP}/netlify-preview-rendered.html"

          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then
            echo "Google Chrome is not available on this runner."
            exit 1
          fi

          timeout 60s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --dump-dom \
            "$target/" > "$rendered"

          grep -Fq 'Archivo 2022 · reconstrucción 2026' "$rendered"
          grep -Fq 'id="main-content"' "$rendered"
          grep -Fq 'id="nosotros"' "$rendered"
          grep -Fq 'id="servicios"' "$rendered"
          grep -Fq 'id="backstage"' "$rendered"
          grep -Fq 'id="equipo"' "$rendered"
          grep -Fq 'id="contacto"' "$rendered"
          grep -Fq 'id="historia"' "$rendered"

          if grep -Eiq '<form([ >])' "$rendered"; then
            echo "Unexpected live form rendered in Contacto archive."
            exit 1
          fi

          echo "Netlify preview smoke passed for $target"

      - name: Discover current public endpoint authority
        shell: bash
        run: |
          set -euo pipefail

          work="${RUNNER_TEMP}/public-endpoint-discovery"
          mkdir -p "$work"

          inspect() {
            local label="$1"
            local url="$2"
            local body="$work/${label}.html"

            local status
            status="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --output "$body" \
              --write-out '%{http_code}' \
              --url "$url" || true)"

            local final_url
            final_url="$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --output /dev/null \
              --write-out '%{url_effective}' \
              --url "$url" || true)"

            echo "ENDPOINT[$label] requested=$url status=$status final=$final_url"

            if [ "$status" = "200" ] && [ -s "$body" ]; then
              local title
              title="$(grep -oiE '<title>[^<]*</title>' "$body" | head -n 1 || true)"
              echo "ENDPOINT[$label] $title"

              if grep -Fq 'El Núcleo | CINE — Archivo y reconstrucción 2026' "$body"; then
                echo "ENDPOINT[$label] authority=modern-2026"
              elif grep -Fq 'El núcleo | Producciones' "$body"; then
                echo "ENDPOINT[$label] authority=historical-2022"
              else
                echo "ENDPOINT[$label] authority=unknown"
              fi
            else
              echo "ENDPOINT[$label] authority=unavailable"
            fi
          }

          inspect netlify-production "https://el-nucleo-producciones.netlify.app/"
          inspect github-pages "https://enzopinotti.github.io/El_Nucleo_Web/"

          # Discovery is evidence, not a pass/fail gate. Preview qualification above remains strict.
          exit 0
