name: Content platform browser smoke once

on:
  push:
    branches:
      - modernize/2026-content-platform
    paths:
      - .github/workflows/content-platform-browser-smoke-once.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out content platform branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: modernize/2026-content-platform

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install and build
        working-directory: modern
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Serve production build
        run: |
          mkdir -p content-platform-qa
          cd modern
          pnpm preview --host 127.0.0.1 --port 4173 > ../content-platform-qa/preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat ../content-platform-qa/preview.log
          exit 1

      - name: Qualify production document in Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || { echo "Chrome/Chromium unavailable"; exit 1; }
          "$CHROME_BIN" --version | tee content-platform-qa/browser-version.txt
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/el-nucleo-content-platform \
            http://127.0.0.1:4173/ > content-platform-qa/chrome.log 2>&1 &

          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9222/json/list > /dev/null && break
            sleep 1
          done

          cat > content-platform-qa/capture.mjs <<'NODE'
          import fs from "node:fs/promises";

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const targets = await fetch("http://127.0.0.1:9222/json/list").then((r) => r.json());
          const target = targets.find((candidate) => candidate.type === "page");
          if (!target?.webSocketDebuggerUrl) throw new Error("Chrome page target unavailable");

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(event.data);
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            message.error ? waiter.reject(new Error(message.error.message)) : waiter.resolve(message.result ?? {});
          });
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const next = ++id;
            pending.set(next, { resolve, reject });
            socket.send(JSON.stringify({ id: next, method, params }));
          });
          const evaluate = async (expression) => {
            const result = await send("Runtime.evaluate", { expression, awaitPromise: true, returnByValue: true });
            if (result.exceptionDetails) throw new Error(result.exceptionDetails.text ?? "Runtime.evaluate failed");
            return result.result?.value;
          };
          const setViewport = async (width, height) => {
            await send("Emulation.setDeviceMetricsOverride", {
              width,
              height,
              deviceScaleFactor: 1,
              mobile: false,
              screenWidth: width,
              screenHeight: height,
            });
            await evaluate("window.scrollTo(0, 0)");
            await sleep(180);
          };
          const warmImages = async () => evaluate(`(async () => {
            for (const image of [...document.images]) {
              image.scrollIntoView({ block: "center", behavior: "instant" });
              await new Promise((resolve) => setTimeout(resolve, 70));
            }
            await Promise.all([...document.images].map((image) => image.complete ? Promise.resolve() : new Promise((resolve) => {
              image.addEventListener("load", resolve, { once: true });
              image.addEventListener("error", resolve, { once: true });
              setTimeout(resolve, 1800);
            })));
            window.scrollTo(0, 0);
            await new Promise((resolve) => setTimeout(resolve, 180));
          })()`);
          const screenshot = async (name) => {
            const metrics = await send("Page.getLayoutMetrics");
            const content = metrics.cssContentSize ?? metrics.contentSize;
            const shot = await send("Page.captureScreenshot", {
              format: "png",
              fromSurface: true,
              captureBeyondViewport: true,
              clip: { x: 0, y: 0, width: content.width, height: content.height, scale: 1 },
            });
            await fs.writeFile(`content-platform-qa/${name}.png`, Buffer.from(shot.data, "base64"));
          };

          await send("Page.enable");
          await send("Runtime.enable");
          await sleep(450);

          const evidence = { viewports: {} };
          for (const viewport of [
            { name: "mobile-360", width: 360, height: 900 },
            { name: "tablet-768", width: 768, height: 1024 },
            { name: "desktop-1440", width: 1440, height: 1000 },
          ]) {
            await setViewport(viewport.width, viewport.height);
            await warmImages();
            await screenshot(`content-${viewport.name}`);
            evidence.viewports[viewport.name] = {
              overflow: await evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth"),
              landmarks: await evaluate(`(() => ({
                h1: document.querySelectorAll("h1").length,
                header: document.querySelectorAll("header.site-header").length,
                nav: document.querySelectorAll('nav[aria-label="Navegación principal"]').length,
                main: document.querySelectorAll("main#main-content").length,
                footer: document.querySelectorAll("footer.site-footer").length
              }))()`),
            };
          }

          await setViewport(1440, 1000);
          await warmImages();
          evidence.fragments = await evaluate(`(() => [...document.querySelectorAll('nav[aria-label="Navegación principal"] a[href^="#"]')].map((link) => ({ href: link.getAttribute("href"), targetExists: Boolean(document.querySelector(link.getAttribute("href"))) })))()`);
          evidence.images = await evaluate(`(() => [...document.images].map((img) => ({ src: img.getAttribute("src"), complete: img.complete, naturalWidth: img.naturalWidth, alt: img.alt, loading: img.getAttribute("loading"), hero: Boolean(img.closest(".hero__mark")) })))()`);
          evidence.contact = await evaluate(`(() => { const contact = document.querySelector("#contacto"); return { exists: Boolean(contact), forms: contact?.querySelectorAll("form").length ?? -1, controls: contact?.querySelectorAll("input, textarea, select, button").length ?? -1 }; })()`);
          evidence.copy = await evaluate(`(() => ({ brand: document.querySelector(".brand__name")?.textContent?.trim(), tag: document.querySelector(".brand__tag")?.textContent?.trim(), edition: document.querySelector(".site-header__edition")?.textContent?.trim(), footer: document.querySelector(".site-footer p")?.textContent?.trim() }))()`);

          await send("Page.reload", { ignoreCache: true });
          await sleep(450);
          await setViewport(1440, 1000);
          await evaluate("window.scrollTo(0, 0); document.activeElement?.blur?.()");
          await send("Input.dispatchKeyEvent", { type: "keyDown", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          await send("Input.dispatchKeyEvent", { type: "keyUp", key: "Tab", code: "Tab", windowsVirtualKeyCode: 9 });
          evidence.firstTab = await evaluate(`(() => ({ href: document.activeElement?.getAttribute?.("href") ?? null, text: document.activeElement?.textContent?.replace(/\\s+/g, " ").trim() ?? null }))()`);
          await send("Emulation.setEmulatedMedia", { features: [{ name: "prefers-reduced-motion", value: "reduce" }] });
          evidence.reducedMotion = await evaluate("getComputedStyle(document.documentElement).scrollBehavior");

          const failures = [];
          if (Object.values(evidence.viewports).some((viewport) => viewport.overflow)) failures.push("Document overflow detected");
          if (Object.values(evidence.viewports).some((viewport) => Object.values(viewport.landmarks).some((count) => count !== 1))) failures.push(`Landmark semantics mismatch: ${JSON.stringify(evidence.viewports)}`);
          if (!evidence.fragments.length || evidence.fragments.some((fragment) => !fragment.targetExists)) failures.push(`Broken navigation fragment: ${JSON.stringify(evidence.fragments)}`);
          if (!evidence.images.length || evidence.images.some((image) => !image.complete || image.naturalWidth <= 0 || !image.alt.trim())) failures.push("Promoted image load/alt contract failed");
          if (evidence.images.some((image) => /^https?:\/\//i.test(image.src ?? ""))) failures.push("External essential image dependency detected");
          if (evidence.images.some((image) => !image.hero && image.loading !== "lazy")) failures.push("Below-fold image is not lazy");
          if (!evidence.contact.exists || evidence.contact.forms !== 0 || evidence.contact.controls !== 0) failures.push(`Contacto interactive boundary failed: ${JSON.stringify(evidence.contact)}`);
          if (evidence.copy.brand !== "El Núcleo" || evidence.copy.tag !== "CINE" || evidence.copy.edition !== "Archivo 2022 · reconstrucción 2026" || !evidence.copy.footer?.includes("original 2022 · reconstrucción 2026")) failures.push(`Content authority render mismatch: ${JSON.stringify(evidence.copy)}`);
          if (evidence.firstTab?.href !== "#main-content") failures.push(`First Tab mismatch: ${JSON.stringify(evidence.firstTab)}`);
          if (evidence.reducedMotion !== "auto") failures.push(`Reduced-motion contract failed: ${evidence.reducedMotion}`);

          evidence.failures = failures;
          await fs.writeFile("content-platform-qa/evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          socket.close();
          if (failures.length) throw new Error(failures.join("; "));
          NODE

          node content-platform-qa/capture.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: content-platform-2026-qa
          path: content-platform-qa/
          if-no-files-found: error
          retention-days: 7
