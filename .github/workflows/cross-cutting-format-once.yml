name: Cross-cutting format once

on:
  push:
    branches:
      - modernize/2026-cross-cutting-quality
    paths:
      - .github/workflows/cross-cutting-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out cross-cutting branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-cross-cutting-quality

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modern/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: modern
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier to the contract test only
        working-directory: modern
        run: pnpm exec prettier --write src/__tests__/document-contract.test.tsx

      - name: Commit canonical formatting if needed
        run: |
          if git diff --quiet -- modern/src/__tests__/document-contract.test.tsx; then
            echo "No formatter diff produced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern/src/__tests__/document-contract.test.tsx
          git commit -m "chore(quality): normalize isolated contract test"
          git push origin HEAD:modernize/2026-cross-cutting-quality
