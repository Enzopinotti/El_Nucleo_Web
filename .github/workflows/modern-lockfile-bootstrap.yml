name: Bootstrap modern app lockfile

on:
  push:
    branches:
      - modernize/2026-foundation
    paths:
      - modern/package.json
      - .github/workflows/modern-lockfile-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: modern-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: modernize/2026-foundation
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Generate and validate lockfile
        working-directory: modern
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm check

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- modern/pnpm-lock.yaml && git ls-files --error-unmatch modern/pnpm-lock.yaml >/dev/null 2>&1; then
            echo "Lockfile already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern/pnpm-lock.yaml
          git commit -m "chore(modern): lock reproducible dependencies"
          git push origin HEAD:modernize/2026-foundation
